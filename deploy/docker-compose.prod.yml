# Production: the app on the production host (deploy/aws/host.yml), which it shares with the
# frontend. The database is the one named in DATABASE_URL (no Postgres container here).
# The app listens on localhost only; the host's nginx routes to it.
# Copied to /opt/pri-backend by the deploy-production workflow, next to a rendered .env.
services:
  web:
    image: ${IMAGE}
    restart: unless-stopped
    env_file: .env
    ports:
      - "127.0.0.1:8000:8000"
