components:
  schemas:
    AccessRequest:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        user:
          type: integer
          readOnly: true
        dataset:
          type: integer
        status:
          allOf:
          - $ref: '#/components/schemas/AccessRequestStatusEnum'
          readOnly: true
        requested_at:
          type: string
          format: date-time
          readOnly: true
        reviewed_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        reviewed_by:
          type: integer
          readOnly: true
          nullable: true
      required:
      - dataset
      - id
      - requested_at
      - reviewed_at
      - reviewed_by
      - status
      - user
    AccessRequestReviewStatusEnum:
      enum:
      - approved
      - denied
      type: string
      description: |-
        * `approved` - Approved
        * `denied` - Denied
    AccessRequestStatusEnum:
      enum:
      - pending
      - approved
      - denied
      type: string
      description: |-
        * `pending` - Pending
        * `approved` - Approved
        * `denied` - Denied
    AuditLog:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        actor:
          type: integer
          readOnly: true
        module:
          type: string
          maxLength: 50
        action:
          type: string
          maxLength: 100
        target:
          type: string
          maxLength: 200
        metadata: {}
        timestamp:
          type: string
          format: date-time
          readOnly: true
      required:
      - action
      - actor
      - id
      - module
      - target
      - timestamp
    ContentBlock:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        slug:
          type: string
          maxLength: 50
          pattern: ^[-a-zA-Z0-9_]+$
        title:
          type: string
          maxLength: 200
        body:
          type: string
        seo_title:
          type: string
          maxLength: 200
        seo_description:
          type: string
          maxLength: 300
        status:
          allOf:
          - $ref: '#/components/schemas/WorkflowStatusEnum'
          readOnly: true
        created_by:
          type: integer
          readOnly: true
        reviewed_by:
          type: integer
          readOnly: true
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - body
      - created_at
      - created_by
      - id
      - reviewed_by
      - slug
      - status
      - title
      - updated_at
    Dashboard:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        slug:
