openapi: 3.0.3
info:
  title: PRI Backend API
  version: 1.0.0
  description: v1 API for the PRI platform — see docs/api/*.md for the module-by-module
    contract.
paths:
  /api/v1/access-requests/:
    get:
      operationId: v1_access_requests_list
      description: |-
        GET /access-requests/?status=&dataset= — addition beyond docs/api/module-c-data-repository.md's
        literal endpoint table: staff need to see which {id}s are pending before the PATCH
        review endpoint below is usable. See the plan's "Two additions beyond the docs" note.
      parameters:
      - in: query
        name: dataset
        schema:
          type: integer
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - in: query
        name: status
        schema:
          type: string
          enum:
          - approved
          - denied
          - pending
        description: |-
          * `pending` - Pending
          * `approved` - Approved
          * `denied` - Denied
      tags:
      - Module C — Data Repository
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAccessRequestList'
          description: ''
  /api/v1/access-requests/{id}/:
    patch:
      operationId: v1_access_requests_partial_update
      description: |-
        PATCH /access-requests/{id}/ — proposed shape from docs/api/module-c-data-repository.md,
        mirroring the existing single-field-status-update + AuditLog pattern
        (apps/accounts/views.py's UserRoleUpdateView).
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - Module C — Data Repository
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedAccessRequestReview'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedAccessRequestReview'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedAccessRequestReview'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessRequest'
          description: ''
  /api/v1/applications/:
    get:
      operationId: v1_applications_list
      description: Staff read applications, open their files and mark them reviewed
        (or new again).
      parameters:
      - in: query
        name: kind
        schema:
          type: string
          enum:
          - fellowship
          - internship
          - job
        description: |-
          * `fellowship` - Fellowship
          * `internship` - Internship
          * `job` - Job
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - in: query
        name: status
        schema:
          type: string
          enum:
          - new
          - reviewed
        description: |-
          * `new` - New
          * `reviewed` - Reviewed
      tags:
      - Module D — Careers & Applications
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedApplicationList'
          description: ''
  /api/v1/applications/{id}/:
    get:
      operationId: v1_applications_retrieve
      description: Staff read applications, open their files and mark them reviewed
        (or new again).
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this application.
        required: true
      tags:
      - Module D — Careers & Applications
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Application'
          description: ''
    patch:
      operationId: v1_applications_partial_update
      description: Staff read applications, open their files and mark them reviewed
        (or new again).
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this application.
        required: true
      tags:
      - Module D — Careers & Applications
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedApplication'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedApplication'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedApplication'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Application'
          description: ''
  /api/v1/applications/{id}/files/{document}/:
    get:
      operationId: v1_applications_files_retrieve
      description: A link to the applicant's CV or SOP. On S3 it is presigned and
        expires; never stored on the page.
      parameters:
      - in: path
        name: document
        schema:
          type: string
          enum:
          - cv
          - sop
        required: true
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this application.
        required: true
      tags:
      - Module D — Careers & Applications
      security:
      - jwtAuth: []
      responses:
        '200':
          description: '{"file": "<short-lived URL>"}'
  /api/v1/apply/:
    post:
      operationId: v1_apply_create
      description: The public application form (fellowships, internships and job openings),
        with a CV and an SOP.
      tags:
      - Module D — Careers & Applications
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ApplicationSubmission'
        required: true
      security:
      - {}
      responses:
        '201':
          description: Received.
        '400':
          description: Invalid fields.
        '429':
          description: Too many applications.
