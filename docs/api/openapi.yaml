        removes it (see `destroy`).
      parameters:
      - in: query
        name: email_verified
        schema:
          type: boolean
      - in: query
        name: is_active
        schema:
          type: boolean
      - in: query
        name: joined_after
        schema:
          type: string
          format: date
      - in: query
        name: joined_before
        schema:
          type: string
          format: date
      - in: query
        name: newsletter_opt_in
        schema:
          type: boolean
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: purpose
        schema:
          type: string
          enum:
          - business
          - journalism
          - other
          - personal
          - policy
          - research
          - teaching
        description: |-
          * `research` - Research
          * `journalism` - Journalism
          * `policy` - Policy or government
          * `teaching` - Teaching or study
          * `business` - Business
          * `personal` - Personal interest
          * `other` - Other
      - in: query
        name: q
        schema:
          type: string
        description: Matches username, email, first or last name
      - in: query
        name: role
        schema:
          type: string
          enum:
          - admin
          - editor
          - fellow
          - public
          - researcher
        description: |-
          * `public` - Donor / Visitor
          * `researcher` - Researcher
          * `editor` - Editor
          * `fellow` - Intern / Fellow
          * `admin` - Admin
      - in: query
        name: staff
        schema:
          type: boolean
      tags:
      - Module H — Users & Roles
      security:
      - jwtAuth: []
      responses:
