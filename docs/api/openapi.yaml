        * `public` - Public
        * `private` - Private
    RoleEnum:
      enum:
      - public
      - researcher
      - editor
      - fellow
      - admin
      type: string
      description: |-
        * `public` - Donor / Visitor
        * `researcher` - Researcher
        * `editor` - Editor
        * `fellow` - Intern / Fellow
        * `admin` - Admin
    SubTheme:
      type: object
      description: |-
        Used under the nested /themes/{theme_pk}/subthemes/ routes — `parent` comes from
        the URL (see SubThemeViewSet), not the request body, so it's read-only here.
      properties:
        id:
          type: integer
          readOnly: true
        slug:
          type: string
          maxLength: 50
          pattern: ^[-a-zA-Z0-9_]+$
        name:
          type: string
          maxLength: 50
        parent:
          type: integer
          readOnly: true
          nullable: true
      required:
      - id
      - name
      - parent
      - slug
    Testimonial:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        slug:
          type: string
          maxLength: 50
          pattern: ^[-a-zA-Z0-9_]+$
        quote:
          type: string
        attribution:
          type: string
          maxLength: 200
        role:
          type: string
          maxLength: 200
        status:
          allOf:
          - $ref: '#/components/schemas/WorkflowStatusEnum'
          readOnly: true
        created_by:
          type: integer
          readOnly: true
        reviewed_by:
          type: integer
          readOnly: true
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - attribution
      - created_at
      - created_by
      - id
      - quote
      - reviewed_by
      - slug
      - status
      - updated_at
    Theme:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        slug:
          type: string
          maxLength: 50
          pattern: ^[-a-zA-Z0-9_]+$
        name:
          type: string
          maxLength: 50
        parent:
          type: integer
          nullable: true
        subthemes:
          type: array
          items:
            $ref: '#/components/schemas/ThemeChild'
          readOnly: true
      required:
      - id
      - name
      - slug
      - subthemes
    ThemeChild:
      type: object
      description: |-
        Shallow representation used for nesting — deliberately doesn't nest its own
        subthemes, since Theme is restricted to 2 levels (see Theme.clean()).
      properties:
        id:
          type: integer
          readOnly: true
        slug:
          type: string
          maxLength: 50
          pattern: ^[-a-zA-Z0-9_]+$
        name:
          type: string
          maxLength: 50
      required:
      - id
      - name
      - slug
    TokenBlacklist:
      type: object
      properties:
        refresh:
          type: string
          writeOnly: true
      required:
      - refresh
    TokenObtainPair:
      type: object
      properties:
        username:
          type: string
          writeOnly: true
        password:
          type: string
          writeOnly: true
        access:
          type: string
          readOnly: true
        refresh:
          type: string
          readOnly: true
      required:
