  /api/v1/token/:
    post:
      operationId: v1_token_create
      description: |-
        Exchanges a username or email address, and a password, for an access/refresh token pair.

        Throttled per username: the sixth attempt within a minute answers 429.
      tags:
      - Module H — Users & Roles
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenObtainPair'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenObtainPair'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenObtainPair'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenObtainPair'
          description: ''
  /api/v1/token/google/:
    post:
      operationId: v1_token_google_create
      description: |-
        Exchanges a "Sign in with Google" ID token for the same access/refresh pair as `/token/`.

        The token must be signed by Google for this site's client ID and carry a verified address. An active account
        with that address (or username) is signed in; otherwise a visitor account is created, already confirmed and
        with no password. Answers 404 while `GOOGLE_CLIENT_ID` is unset, 401 for a token it can't accept or an
        inactive account, and 503 when Google's keys can't be fetched.
      tags:
      - Module H — Users & Roles
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GoogleLogin'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/GoogleLogin'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/GoogleLogin'
        required: true
      security:
      - {}
      responses:
        '200':
          description: No response body
  /api/v1/token/logout/:
    post:
      operationId: v1_token_logout_create
      description: 'Signs out: blacklists the refresh token so it can no longer mint
        access tokens.'
      tags:
      - Module H — Users & Roles
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenBlacklist'
