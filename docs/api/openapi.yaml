      - updated_at
    Publication:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        slug:
          type: string
          maxLength: 50
          pattern: ^[-a-zA-Z0-9_]+$
        title:
          type: string
          maxLength: 200
        abstract:
          type: string
        format:
          $ref: '#/components/schemas/PublicationFormatEnum'
        sub_theme:
          type: integer
        language:
          $ref: '#/components/schemas/LanguageEnum'
        date:
          type: string
          format: date
        authors:
          type: array
          items:
            type: integer
        external_id:
          type: string
          maxLength: 100
        visibility:
          $ref: '#/components/schemas/PublicationVisibilityEnum'
        tags:
          type: array
          items:
            type: string
            maxLength: 50
        views:
          type: integer
          maximum: 2147483647
          minimum: 0
        cover_url:
          oneOf:
          - type: string
            format: uri
            maxLength: 200
          - type: string
            maxLength: 0
        status:
          allOf:
          - $ref: '#/components/schemas/WorkflowStatusEnum'
          readOnly: true
        created_by:
          type: integer
          readOnly: true
        reviewed_by:
          type: integer
          readOnly: true
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        published_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
      required:
      - abstract
      - created_at
      - created_by
      - date
      - format
      - id
      - published_at
      - reviewed_by
      - slug
      - status
      - sub_theme
      - title
      - updated_at
    PublicationFormatEnum:
      enum:
      - report
      - working_paper
      - brief
      - explainer
      - infographic
      - video
      - data_story
      type: string
      description: |-
        * `report` - Report
        * `working_paper` - Working Paper
        * `brief` - Brief
        * `explainer` - Explainer
        * `infographic` - Infographic
        * `video` - Video
        * `data_story` - Data Story
    PublicationVisibilityEnum:
      enum:
      - public
      - private
